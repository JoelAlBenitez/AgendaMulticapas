<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="js/script.js" defer></script>
    <title>Agenda MultiCapas</title>
</head>
<body>
    
    <div class="container"> 

        <div class="container-header">
            <div class="title">
                <i id="person" class="bi bi-person-rolodex"></i>
                <h2>Contactos </h2>
                <span id="totalContacts"></span>
            </div>

            <form bindsubmit="" class="form" >
                <div class="name-input">
                    <label for="name">Nombre:</label>
                    <input placeholder="Juan" type="text" id="name" name="name" required>
                </div>
                <div class="lastName-input">
                    <label for="lastName">Apellido:</label>
                    <input placeholder="Perez" type="text" id="lastName" name="lastName" required>
                </div>
                <div class="phone-input">
                    <label for="phone">Teléfono:</label>
                    <input placeholder="123-456-7890" type="tel" id="phone" name="phone" required>
                </div>              
                 <button id="saveContact" class="btn" type="submit"><i class="bi bi-floppy"></i></button>
            </form>
        </div>
        <div class="Agent-Contact"></div>
    </div>

    
</body>
</html>
